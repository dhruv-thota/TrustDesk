[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustdesk"
version = "0.1.0"
description = "TrustDesk - AI-Assisted Customer Support Operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "psycopg[binary]>=3.1.18",
    "python-dotenv>=1.0.1",
    "google-genai>=2.0.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trustdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

